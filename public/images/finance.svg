<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Pièces, graphique et carnet de comptes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2545"/><stop offset="1" stop-color="#1D4E89"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5D98B"/><stop offset="1" stop-color="#C9962F"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD7F2"/><stop offset="1" stop-color="#6C9BD2"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2">
    <path d="M0 180 H1200 M0 330 H1200 M0 480 H1200 M0 630 H1200 M0 780 H1200"/>
  </g>
  <circle cx="980" cy="170" r="260" fill="#8DB3E2" opacity=".08"/>
  <!-- barres -->
  <g fill="url(#bar)">
    <rect x="150" y="560" width="90" height="220" rx="14"/>
    <rect x="280" y="470" width="90" height="310" rx="14"/>
    <rect x="410" y="400" width="90" height="380" rx="14"/>
    <rect x="540" y="300" width="90" height="480" rx="14"/>
  </g>
  <path d="M150 520 L320 420 L450 380 L600 250 L760 170" fill="none" stroke="#F3D27A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M720 150 L780 160 L760 218" fill="none" stroke="#F3D27A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF"><circle cx="320" cy="420" r="11"/><circle cx="450" cy="380" r="11"/><circle cx="600" cy="250" r="11"/></g>
  <!-- piles de pièces -->
  <g>
    <ellipse cx="880" cy="792" rx="230" ry="26" fill="#000" opacity=".25"/>
    <g id="stack">
      <g transform="translate(760 0)">
        <rect x="-80" y="610" width="160" height="170" fill="url(#coin)"/>
        <ellipse cx="0" cy="780" rx="80" ry="24" fill="#B8862A"/>
        <g stroke="#A97A22" stroke-width="3" opacity=".7"><path d="M-80 644 H80 M-80 678 H80 M-80 712 H80 M-80 746 H80"/></g>
        <ellipse cx="0" cy="610" rx="80" ry="24" fill="#F5D98B"/>
        <ellipse cx="0" cy="610" rx="52" ry="14" fill="none" stroke="#C9962F" stroke-width="4"/>
      </g>
      <g transform="translate(960 0)">
        <rect x="-80" y="520" width="160" height="260" fill="url(#coin)"/>
        <ellipse cx="0" cy="780" rx="80" ry="24" fill="#B8862A"/>
        <g stroke="#A97A22" stroke-width="3" opacity=".7"><path d="M-80 554 H80 M-80 588 H80 M-80 622 H80 M-80 656 H80 M-80 690 H80 M-80 724 H80 M-80 758 H80"/></g>
        <ellipse cx="0" cy="520" rx="80" ry="24" fill="#F5D98B"/>
        <ellipse cx="0" cy="520" rx="52" ry="14" fill="none" stroke="#C9962F" stroke-width="4"/>
      </g>
    </g>
    <!-- pièce en l'air -->
    <g transform="translate(1040 360) rotate(-18)">
      <circle r="78" fill="url(#coin)"/><circle r="58" fill="none" stroke="#B8862A" stroke-width="6"/>
      <text y="22" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="62" fill="#8A6418">F</text>
    </g>
  </g>
  <!-- carnet -->
  <g transform="translate(830 230) rotate(6)">
    <rect width="150" height="190" rx="14" fill="#FFFFFF" opacity=".95"/>
    <rect width="150" height="34" rx="14" fill="#E2B54F"/>
    <g stroke="#1D4E89" stroke-width="7" stroke-linecap="round" opacity=".55"><path d="M24 70 H126 M24 100 H104 M24 130 H120 M24 160 H86"/></g>
  </g>
</svg>
